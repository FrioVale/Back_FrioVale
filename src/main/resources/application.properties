
spring.application.name=frioVale


spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}


# Configuracoes gerais do FrioVale


friovale.timezone=America/Recife
friovale.cors.allowed-origins=${FRIOVALE_CORS_ALLOWEDORIGINS:http://localhost:5173}


# ThingSpeak - Integracao IoT


friovale.thingspeak.base-url=https://api.thingspeak.com
friovale.thingspeak.poll-rate-ms=15000
friovale.thingspeak.log-sync-rate-ms=300000
friovale.thingspeak.log-sync-initial-delay-ms=30000
friovale.thingspeak.connect-timeout=3s
friovale.thingspeak.read-timeout=5s

# Canal adicional de eventos individuais do acelerometro
friovale.thingspeak.impact-events.channel-id=${THINGSPEAK_EVENT_CHANNEL_ID:3551998}
friovale.thingspeak.impact-events.api-key=${THINGSPEAK_EVENT_API_KEY:}


# Seguranca - JWT


friovale.jwt.secret=${FRIOVALE_JWT_SECRET}
friovale.jwt.expiration-minutes=720


# Administrador inicial


friovale.bootstrap.admin-name=Gestor
friovale.bootstrap.admin-email=gestor@friovale.com
friovale.bootstrap.admin-password=${FRIOVALE_BOOTSTRAP_ADMINPASSWORD}


# Envio de e-mails - Brevo

brevo.api.key=${BREVO_API_KEY:}
brevo.sender.email=${BREVO_SENDER_EMAIL:}
brevo.sender.name=${BREVO_SENDER_NAME:FrioVale}


# Agente de Inteligencia Artificial - FastAPI


friovale.ia.api-url=${FRIOVALE_IA_APIURL:http://localhost:8000}
friovale.ia.connect-timeout=${FRIOVALE_IA_CONNECTTIMEOUT:3s}
friovale.ia.read-timeout=${FRIOVALE_IA_READTIMEOUT:5s}
friovale.ia.enabled=${FRIOVALE_IA_ENABLED:true}


# Acelerometro e impactos


friovale.impact.alert-enabled=true
friovale.impact.threshold-g=2.0
friovale.impact.stale-after-minutes=2


# Seguranca da Informacao - Codigo de missao


friovale.security.mission-code=${MISSION_CODE:CODIGO_MISSAO}


# Seguranca - Autenticacao de dois fatores (2FA)


friovale.otp.issuer=FrioVale
friovale.otp.period-seconds=30
friovale.otp.digits=6
friovale.otp.allowed-discrepancy=1


friovale.otp.encryption-key=${FRIOVALE_OTP_ENCRYPTION_KEY}

friovale.otp.max-attempts=5
friovale.otp.lock-minutes=5
friovale.otp.mfa-token-minutes=5
friovale.otp.recovery-code-count=10
